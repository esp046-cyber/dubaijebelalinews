<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Offline | Daily Dubai &amp; Jebel Ali News</title>
<meta name="theme-color" content="#0B1F3A">
<meta name="robots" content="noindex">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center;
    padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
    background: linear-gradient(180deg, #15386A, #06122A); color: #fff;
    font: 400 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; text-align: center;
  }
  main { max-width: 480px; width: 100%; display: grid; gap: 16px; }
  img { margin: 0 auto; border-radius: 18px; }
  h1 { margin: 0; font-size: 1.5rem; color: #F2C94C; }
  p { margin: 0; color: #C8D3E6; }
  .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  a.btn, button {
    min-height: 48px; padding: 0 20px; border-radius: 12px; border: 2px solid #F2C94C; font: inherit; font-weight: 700;
    display: inline-flex; align-items: center; justify-content: center; text-decoration: none; cursor: pointer;
  }
  button { background: #F2C94C; color: #0B1F3A; }
  a.btn { background: transparent; color: #F2C94C; }
  #saved { text-align: left; background: rgba(255, 255, 255, .08); border-radius: 14px; padding: 12px 16px; }
  #saved h2 { margin: 0 0 6px; font-size: 1rem; color: #fff; }
  #saved ul { margin: 0; padding-left: 1.1em; display: grid; gap: 6px; }
  #saved a { color: #fff; }
</style>
</head>
<body>
<main>
  <img src="./favicon.svg" alt="" width="84" height="84">
  <h1>You are offline</h1>
  <p>No connection right now. Your saved stories stay available, and fresh headlines return as soon as you are back online.</p>
  <div class="row">
    <button type="button" id="retry">Try again</button>
    <a class="btn" href="./?view=saved">Open saved stories</a>
  </div>
  <section id="saved" hidden aria-label="Saved stories">
    <h2>Saved stories</h2>
    <ul id="saved-list"></ul>
  </section>
</main>
<script>
(function () {
  document.getElementById('retry').addEventListener('click', function () { location.reload(); });
  window.addEventListener('online', function () { location.href = './'; });
  try {
    var saved = JSON.parse(localStorage.getItem('dj_saved') || '[]');
    if (Array.isArray(saved) && saved.length) {
      var ul = document.getElementById('saved-list');
      saved.slice(0, 15).forEach(function (s) {
        var li = document.createElement('li');
        var a = document.createElement('a');
        a.textContent = String(s.title || 'Saved story');
        try {
          var u = new URL(s.url);
          if (u.protocol === 'https:' || u.protocol === 'http:') { a.href = u.href; a.target = '_blank'; a.rel = 'noopener noreferrer'; }
        } catch (e) {}
        li.appendChild(a); ul.appendChild(li);
      });
      document.getElementById('saved').hidden = false;
    }
  } catch (e) {}
})();
</script>
</body>
</html>
